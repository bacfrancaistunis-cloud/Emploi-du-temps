<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Emploi du temps | BFT</title>

  <meta name="description" content="L'emploi du temps sera bientôt disponible.">

  <style>
    /* =========================
       BASE
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue: #2563eb;
      --blue-dark: #1e40af;
      --purple: #7c3aed;
      --white: #ffffff;
      --text: #172033;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, Arial, Helvetica, sans-serif;
      min-height: 100vh;
      color: var(--text);
      background: #f8fafc;
      overflow: hidden;
    }


    /* =========================
       FOND ANIMÉ
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -2;
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(37, 99, 235, 0.15),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(124, 58, 237, 0.15),
          transparent 35%
        ),
        #f8fafc;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.35;
      animation: float 12s ease-in-out infinite;
    }

    .blob.one {
      width: 350px;
      height: 350px;
      background: #60a5fa;
      top: -120px;
      left: -100px;
    }

    .blob.two {
      width: 400px;
      height: 400px;
      background: #a78bfa;
      right: -150px;
      bottom: -150px;
      animation-delay: -4s;
    }

    .blob.three {
      width: 220px;
      height: 220px;
      background: #38bdf8;
      left: 50%;
      top: 45%;
      animation-delay: -8s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(35px, -30px) scale(1.08);
      }
    }


    /* =========================
       PAGE
    ========================= */

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      padding: 65px 50px;
      text-align: center;

      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 32px;

      box-shadow:
        0 30px 80px rgba(15, 23, 42, 0.12),
        0 8px 25px rgba(37, 99, 235, 0.08);

      animation: cardAppear 1s cubic-bezier(.16, 1, .3, 1);
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(35px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }


    /* =========================
       LOGO / CALENDRIER
    ========================= */

    .calendar {
      width: 110px;
      height: 110px;
      margin: 0 auto 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 52px;

      background: linear-gradient(
        135deg,
        var(--blue),
        var(--purple)
      );

      border-radius: 30px;

      box-shadow:
        0 18px 35px rgba(37, 99, 235, 0.25);

      animation:
        calendarAppear 1s ease-out 0.2s both,
        calendarFloat 4s ease-in-out 1.2s infinite;
    }

    @keyframes calendarAppear {
      from {
        opacity: 0;
        transform: scale(0.5) rotate(-10deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    @keyframes calendarFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }


    /* =========================
       TEXTE
    ========================= */

    .label {
      display: inline-block;
      margin-bottom: 15px;

      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;

      animation: fadeUp 0.8s ease-out 0.4s both;
    }

    h1 {
      font-size: clamp(38px, 7vw, 64px);
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 20px;

      background: linear-gradient(
        135deg,
        #172033,
        var(--blue),
        var(--purple)
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      animation: fadeUp 0.8s ease-out 0.5s both;
    }

    .subtitle {
      max-width: 520px;
      margin: 0 auto;

      color: #64748b;
      font-size: 18px;
      line-height: 1.7;

      animation: fadeUp 0.8s ease-out 0.6s both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================
       BADGE
    ========================= */

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      margin-top: 32px;
      padding: 13px 20px;

      border-radius: 999px;

      color: #1e3a8a;
      background: rgba(219, 234, 254, 0.8);

      font-size: 14px;
      font-weight: 700;

      animation: fadeUp 0.8s ease-out 0.75s both;
    }

    .dot {
      position: relative;

      width: 9px;
      height: 9px;

      border-radius: 50%;
      background: #2563eb;
    }

    .dot::after {
      content: "";

      position: absolute;
      inset: -5px;

      border-radius: 50%;
      background: rgba(37, 99, 235, 0.25);

      animation: pulse 1.8s ease-out infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.7);
        opacity: 1;
      }

      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }


    /* =========================
       LOADER
    ========================= */

    .loader {
      display: flex;
      justify-content: center;
      gap: 7px;

      margin-top: 30px;

      animation: fadeUp 0.8s ease-out 0.9s both;
    }

    .loader span {
      width: 7px;
      height: 7px;

      border-radius: 50%;
      background: var(--blue);

      animation: loading 1.4s infinite ease-in-out;
    }

    .loader span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes loading {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-7px);
        opacity: 1;
      }
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 40px;

      color: #94a3b8;
      font-size: 13px;

      animation: fadeUp 0.8s ease-out 1s both;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      body {
        overflow: auto;
      }

      .page {
        padding: 20px 15px;
      }

      .card {
        padding: 45px 25px;
        border-radius: 25px;
      }

      .calendar {
        width: 90px;
        height: 90px;
        font-size: 42px;
        border-radius: 25px;
        margin-bottom: 25px;
      }

      h1 {
        letter-spacing: -1px;
      }

      .subtitle {
        font-size: 16px;
      }

      .status {
        font-size: 13px;
      }
    }


    /* =========================
       ACCESSIBILITÉ
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>


<body>

  <!-- Arrière-plan animé -->
  <div class="background">
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>
  </div>


  <!-- Contenu principal -->
  <main class="page">

    <section class="card">

      <div class="calendar">
        📅
      </div>

      <span class="label">
        BFT Connect
      </span>

      <h1>
        Emploi du temps
      </h1>

      <p class="subtitle">
        Votre emploi du temps est actuellement en préparation.
        Il sera bientôt disponible sur cette plateforme.
      </p>

      <div class="status">
        <span class="dot"></span>
        Bientôt disponible
      </div>

      <div class="loader">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <p class="footer">
        Merci de votre patience.
      </p>

    </section>

  </main>

</body>
</html>
